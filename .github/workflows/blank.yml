name: anthropic-wif-test
on: push
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange for an Anthropic access token
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_013WxGNqmjEWPnv4KQg15wcR",
            "organization_id": "75b7cde5-8332-4a56-95d2-348868da55bf",
            "service_account_id": "svac_012N4S53N2g7PmgNLT9VbJQn",
            "workspace_id": "wrkspc_014Dwkh33yvPEbssGUFm1YVN"
          }
          JSON
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
